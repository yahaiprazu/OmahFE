<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - OmahFE</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" class="logo-link">
                    <span class="logo-omah">Omah</span>
                    <span class="logo-fe">FE</span>
                </a>
            </div>
            
            <div class="nav-menu">
                <a href="about.html" class="nav-link">About</a>
                <a href="features.html" class="nav-link">Features</a>
                <a href="portfolio.html" class="nav-link">Portfolio</a>
                <a href="testimonials.html" class="nav-link">Testimonials</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
            
            <div class="nav-auth">
                <button class="btn-signin">Sign In</button>
                <button class="btn-signup">Sign Up</button>
            </div>
            
            <div class="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-contact">
        <div class="contact-container">
            <div class="contact-layout">
                <!-- Left Side - Title -->
                <div class="contact-title-section">
                    <h1 class="contact-title">Contact Us</h1>
                </div>

                <!-- Right Side - Form -->
                <div class="contact-form-section">
                    <form class="contact-form" id="contactForm">
                        <!-- Name Fields -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" id="firstName" class="form-input" placeholder="Enter first name" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" id="lastName" class="form-input" placeholder="Enter last name" required>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-input" placeholder="enter@email.com" required>
                        </div>

                        <!-- Message -->
                        <div class="form-group">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" class="form-textarea" rows="6" placeholder="Message" required></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="form-submit">
                            <button type="submit" class="btn-send">
                                <span>Send</span>
                                <img src="images/icons/send.svg" alt="Send" class="btn-icon">
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <img src="images/omahfe.png" alt="OmahFE Logo" class="footer-logo">
                <p class="footer-address">
                    Gedung Fakultas MIPA UGM Sekip Utara, Bulaksumur, Sinduadi, Mlati, Sleman, Di Yogyakarta
                </p>
                <div class="footer-social">
                    <h3 class="social-title">Connect with Us</h3>
                    <div class="social-icons">
                        <a href="#"><img src="images/icons/instagram.svg" alt="Instagram"></a>
                        <a href="#"><img src="images/icons/facebook.svg" alt="Facebook"></a>
                        <a href="#"><img src="images/icons/twitter.svg" alt="Twitter"></a>
                        <a href="#"><img src="images/icons/linkedin.svg" alt="LinkedIn"></a>
                    </div>
                </div>
            </div>

            <div class="footer-links">
                <div class="footer-section">
                    <h3 class="footer-heading">Page</h3>
                    <ul>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="features.html">Our Services</a></li>
                        <li><a href="portfolio.html">Portfolio</a></li>
                        <li><a href="testimonials.html">Testimonials</a></li>
                    </ul>
                </div>

                <div class="footer-section">
                    <h3 class="footer-heading">Support</h3>
                    <ul>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; OmahFE 2025</p>
        </div>
    </footer>

    <script src="js/navigation.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
